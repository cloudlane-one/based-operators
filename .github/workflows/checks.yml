name: Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --group ci

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Pyright
        run: uv run pyright .

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.3

      - name: Run Pytest
        run: uv run pytest tests
        env:
          BASED_OPERATORS_REQUIRE_HELM: "1"

      - name: Smoke-test generated container
        run: uv run pytest -q tests/src/test_container.py
        env:
          BASED_OPERATORS_CONTAINER_SMOKE: "1"

      - name: Check if docs build successfully
        run: uv run vtr build-docs

      - name: Check license compliance
        run: uv run vtr assert-license-compliance

      - name: Check vulnerabilities
        run: uv run vtr assert-no-vulnerabilities

      - name: Check unused undeclared deps
        run: uv run vtr assert-no-deptry-issues
